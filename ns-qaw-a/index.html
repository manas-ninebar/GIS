<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NineOne · Geo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="styles.css?v=24" />
</head>
<body>
  <header class="dock top glass">
    <div class="dock-row command-row">
      <div class="brand">
        <div class="u-mono">NineOne · Geo</div>
        <strong>Tokyo RAN Workbench</strong>
        <span id="counts">—</span>
      </div>
      <label class="search">
        <span class="u-mono">Search</span>
        <input id="search" type="search" autocomplete="off" />
        <div class="typeahead" id="typeahead" hidden></div>
      </label>
      <button type="button" class="dock-btn" id="btn-rail" title="Layer panel (F)">Layers</button>
      <button type="button" class="dock-btn" id="btn-copilot" title="Copilot (C)">Copilot</button>
    </div>
    <div class="dock-row tools-row">
      <div class="toolbar" id="tools" role="toolbar" aria-label="Spatial tools">
        <button type="button" class="tool on" data-tool="pan" title="Pan (P)">Pan</button>
        <div class="tool-group measure-group">
          <button type="button" class="tool" data-tool="ruler" title="Ruler (R)">Ruler</button>
          <button type="button" class="tool" data-tool="radius" title="Radius (A)">Radius</button>
        </div>
        <button type="button" class="tool" data-tool="drop" title="New site (N)">New site</button>
        <div class="seg" role="group" aria-label="View">
          <button type="button" class="tool on" data-view="2d" title="2D">2D</button>
          <button type="button" class="tool" data-view="3d" title="3D">3D</button>
        </div>
        <select id="basemap" title="Basemap">
          <option value="dark">Plan</option>
          <option value="satellite">Satellite</option>
          <option value="terrain">Terrain</option>
          <option value="liberty">Street</option>
          <option value="positron">Soft</option>
        </select>
      </div>
      <details class="more">
        <summary>Export</summary>
        <div class="more-menu glass">
          <button type="button" id="btn-import">Import overlay</button>
          <button type="button" id="btn-geojson">Download GeoJSON</button>
          <button type="button" id="btn-kml">Download KML</button>
          <button type="button" id="btn-shot">Snapshot PNG</button>
        </div>
      </details>
      <input id="file-import" type="file" accept=".geojson,.json,.kml" hidden />
    </div>
    <div class="dock-row context-strip" id="context-strip">
      <div class="u-mono" id="context-label">Context</div>
      <div class="context-actions" id="context-actions"></div>
    </div>
  </header>

  <div class="stage" id="stage">
  <div id="map"></div>
  <div class="chips" id="chips"></div>

  <aside class="drawer glass" id="rail" hidden>
    <header>
      <div>
        <div class="u-mono">Layers + filters</div>
      </div>
      <button type="button" class="icon-btn" id="rail-x">×</button>
    </header>
    <div class="facets" id="facets"></div>
  </aside>

  <aside class="drawer drawer-right glass" id="copilot" hidden>
    <header class="copilot-head">
      <div>
        <div class="u-mono">Copilot + commands</div>
        <h2>Spatial Actions</h2>
      </div>
      <button type="button" class="icon-btn" id="copilot-x">×</button>
    </header>
    <div class="copilot-subhead u-mono">Quick Actions</div>
    <div class="starters" id="starters"></div>
    <div class="log" id="log" aria-live="polite"></div>
    <form class="composer" id="composer">
      <button type="button" class="mic" id="btn-mic" title="Voice command">Voice</button>
      <input id="ask" type="text" autocomplete="off" />
      <button type="submit">Run</button>
    </form>
  </aside>

  <article class="card glass" id="card" hidden></article>
  <div class="measure glass" id="measure" hidden></div>
  </div>

  <footer class="dock bottom glass">
    <span class="pill-stat" id="hud-crs">CRS EPSG:4326</span>
    <span class="pill-stat" id="hud-zoom">Zoom —</span>
    <span class="pill-stat" id="hud-cursor">Cursor —</span>
    <span class="pill-stat" id="hud-selection">Selection 0</span>
    <span class="pill-stat" id="hud-latency">Frame — ms</span>
    <span class="u-mono" id="clock-label">Clock</span>
  </footer>

  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@9.1.12/dist.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
  <script type="module" src="app.js?v=24"></script>
</body>
</html>
